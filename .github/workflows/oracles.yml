# The external-oracle gates, which CI cannot run on every push: the pinned
# SingleStepTests corpus is ~580 MB to clone, and z80full alone takes minutes.
# Scheduled weekly, and runnable on demand.
#
# Not covered here: ZEXDOC/ZEXALL. Those need zexdoc.com/zexall.com, which are
# not fetched by any script in this repository, and take ~90 minutes each under
# CPython. They are certified locally and recorded, with timings and hashes, in
# docs/validation.md.
name: Oracles

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      # Keyed on the pinned revision, so the cache is invalidated by changing
      # the pin and by nothing else.
      - name: Restore the SingleStepTests corpus
        id: vectors
        uses: actions/cache@v4
        with:
          path: tests/z80_test_vectors
          key: sst-z80-ebe1875d48f374bcfd4b505d8eb8ee751568b5f7

      - name: Fetch the SingleStepTests corpus
        if: steps.vectors.outputs.cache-hit != 'true'
        run: python scripts/fetch_test_vectors.py

      - run: python scripts/fetch_z80test.py
      - run: python scripts/fetch_fuse_tests.py

      - name: SingleStepTests — 1,604 files, 1,604,000 cases
        run: python -m pytest tests/test_z80.py -q

      - name: z80test — z80full, z80ccf, z80memptr
        run: python -m pytest tests/test_z80test_suite.py -q

      - name: FUSE — 1,356 cases, six pinned divergences
        run: python -m pytest tests/test_fuse_suite.py -q

      - name: Interrupt cross-check vs superzazu/z80
        run: python -m pytest tests/test_interrupt_crosscheck.py -q
