[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "z80-python"
version = "0.1.2"
description = "Readable, pure-Python Z80 instruction-core reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alewman/z80-python"
Repository = "https://github.com/alewman/z80-python"
Issues = "https://github.com/alewman/z80-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/z80_python"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".pytest_cache", "tests/z80_test_vectors"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["z80", "z80_python"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -ra"
pythonpath = ["src", "."]
markers = [
    "unit: fast unit tests for a single component (default)",
    "integration: tests that exercise multiple components together",
    "slow: long-running tests (for example, full Z80 instruction-set validation)",
]
